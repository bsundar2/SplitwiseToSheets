name: Backfill Historical Years

# One-off maintenance workflow: re-syncs historical years' Splitwise
# expenses into the local database, using the same transactions-db-enc-<branch>
# cache splitwise-sync.yml restores/saves - for cases where that cache
# only reflects the current year (e.g. after a cache reset) and all-time
# views built from the exported Sheets data lose historical data as a
# result. Splitwise itself is always the source of truth and is untouched
# either way - this only rebuilds the local mirror.
#
# Dispatch manually with a year range. dry_run defaults to true so you can
# preview counts before committing to a live backfill. Runs one year at a
# time with a pause in between (delay_seconds) to avoid bursting the
# Splitwise API across a large range.

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'First year to backfill (inclusive)'
        required: true
        type: string
      end_year:
        description: 'Last year to backfill (inclusive)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (preview only, no writes to the database)'
        required: false
        type: boolean
        default: true
      delay_seconds:
        description: 'Seconds to pause between years'
        required: false
        type: string
        default: '10'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Splitwise data cache
        uses: actions/cache/restore@v4
        with:
          path: data/transactions.db.enc
          key: transactions-db-enc-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            transactions-db-enc-${{ github.ref_name }}-

      - name: Decrypt cached database
        env:
          DB_CACHE_KEY: ${{ secrets.DB_CACHE_KEY }}
        run: scripts/ci/db_cache.sh decrypt

      - name: Write Google Sheets service account credentials
        env:
          GSHEETS_AUTH_JSON: ${{ secrets.GSHEETS_AUTH_JSON }}
        run: printf '%s' "$GSHEETS_AUTH_JSON" > config/gsheets_authentication.json

      - name: Run backfill
        env:
          PYTHONPATH: ${{ github.workspace }}
          SPLITWISE_CONSUMER_KEY: ${{ secrets.SPLITWISE_CONSUMER_KEY }}
          SPLITWISE_CONSUMER_SECRET: ${{ secrets.SPLITWISE_CONSUMER_SECRET }}
          SPLITWISE_API_KEY: ${{ secrets.SPLITWISE_API_KEY }}
          SPLITWISE_SELF_ID: ${{ secrets.SPLITWISE_SELF_ID }}
          SPLITWISE_PARTNER_ID: ${{ secrets.SPLITWISE_PARTNER_ID }}
          START_YEAR: ${{ github.event.inputs.start_year }}
          END_YEAR: ${{ github.event.inputs.end_year }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DELAY_SECONDS: ${{ github.event.inputs.delay_seconds }}
        run: |
          set -euo pipefail
          ARGS=(--start-year "$START_YEAR" --end-year "$END_YEAR" --delay-seconds "$DELAY_SECONDS")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/backfill_history.py "${ARGS[@]}"

      - name: Encrypt database for caching
        if: always()
        env:
          DB_CACHE_KEY: ${{ secrets.DB_CACHE_KEY }}
        run: scripts/ci/db_cache.sh encrypt

      - name: Save Splitwise data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/transactions.db.enc
          key: transactions-db-enc-${{ github.ref_name }}-${{ github.run_id }}
