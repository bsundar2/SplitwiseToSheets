name: Sync Splitwise to Sheets

# Refreshes the local database and Google Sheets from Splitwise.
# Statement-CSV/Drive import is no longer part of this workflow - Splitwise
# now syncs cards directly, so there's nothing left to import here. Budget
# summaries are no longer generated here either - they're now pulled
# directly from the raw exported data in Sheets instead.
#
# Ways to run this:
#   1. Manually dispatch this workflow (Actions tab / GitHub mobile app).
#      dry_run defaults to true so you can preview first; uncheck it to
#      actually write to Sheets.
#   2. Runs automatically three times a day (see schedule below) for the
#      current year, so Sheets stays current without manual action.

on:
  schedule:
    # 05:17, 13:17 and 21:17 UTC daily - about 10pm, 6am and 2pm Pacific
    # (avoids the top of the hour, when scheduled-job load is highest and
    # runs are more likely to be delayed).
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no writes to Splitwise/Sheets)'
        required: false
        type: boolean
        default: true
      year:
        description: 'Year to sync (defaults to current year if left blank)'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The splitwise_expense_details_*.json glob must match the filenames
      # generated by _get_expense_cache_path() in src/common/splitwise_client.py
      # (splitwise_expense_details_<year>.json or _<year1>_<year2>.json) - if
      # that naming logic ever changes, update this glob to match, or the
      # cache silently stops matching and CI reverts to rebuilding it fresh.
      - name: Restore Splitwise data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/transactions.db
            data/splitwise_expense_details_*.json
          key: transactions-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            transactions-db-${{ github.ref_name }}-

      - name: Determine run mode
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
          DISPATCH_YEAR: ${{ github.event.inputs.year }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY_RUN="$DISPATCH_DRY_RUN"
          else
            # Scheduled runs always sync/export live for the current year -
            # no dry_run, since there's nothing destructive left in this
            # workflow to preview.
            DRY_RUN="false"
          fi
          YEAR="${DISPATCH_YEAR:-$(date +%Y)}"

          {
            echo "dry_run=$DRY_RUN"
            echo "year=$YEAR"
          } >> "$GITHUB_OUTPUT"

      - name: Write Google Sheets service account credentials
        env:
          GSHEETS_AUTH_JSON: ${{ secrets.GSHEETS_AUTH_JSON }}
        run: printf '%s' "$GSHEETS_AUTH_JSON" > config/gsheets_authentication.json

      - name: Run monthly export pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
          SPLITWISE_CONSUMER_KEY: ${{ secrets.SPLITWISE_CONSUMER_KEY }}
          SPLITWISE_CONSUMER_SECRET: ${{ secrets.SPLITWISE_CONSUMER_SECRET }}
          SPLITWISE_API_KEY: ${{ secrets.SPLITWISE_API_KEY }}
          SPLITWISE_SELF_ID: ${{ secrets.SPLITWISE_SELF_ID }}
          SPLITWISE_PARTNER_ID: ${{ secrets.SPLITWISE_PARTNER_ID }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
          SYNC_YEAR: ${{ steps.config.outputs.year }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
        run: |
          set -euo pipefail
          # No --worksheet override needed - the script's own default
          # ("Expense Log") already matches the sheet tab the Monthly
          # Expenses formulas reference.
          ARGS=(--year "$SYNC_YEAR")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python src/export/monthly_export_pipeline.py "${ARGS[@]}"

      - name: Save Splitwise data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/transactions.db
            data/splitwise_expense_details_*.json
          key: transactions-db-${{ github.ref_name }}-${{ github.run_id }}
