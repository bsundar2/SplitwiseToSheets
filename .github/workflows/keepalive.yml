name: Keep Scheduled Workflows Alive

# GitHub disables a public repo's scheduled workflows after 60 days with no
# repository activity. Re-enabling a workflow through the API resets that
# timer, so this does it once a month for every scheduled workflow
# (itself included). No commits are made.

on:
  schedule:
    - cron: '41 9 3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in splitwise-sync.yml keepalive.yml; do
            gh workflow enable "$workflow"
            echo "Re-enabled $workflow"
          done
